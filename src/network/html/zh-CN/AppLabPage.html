<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Lab - CrossMux</title>
    <style>
      .applab-form label { display: block; margin: 12px 0 4px; color: var(--label-color); font-size: 0.9em; }
      /* 16px stops iOS from zooming the page when a field gets focus. */
      .applab-form input,
      .applab-form textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        font-size: 16px;
        font-family: inherit;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      .applab-form textarea { min-height: 140px; resize: vertical; }
      .applab-form .save-btn { width: 100%; }
      #status { padding: 10px; border-radius: 6px; margin: 16px 0; display: none; }
      #status.ok { background: #d4edda; color: #155724; display: block; }
      #status.err { background: #f8d7da; color: #721c24; display: block; }
      .warn { background: #fff3cd; color: #664d03; padding: 10px; border-radius: 6px; }
      .hint { color: var(--label-color); font-size: 0.85em; }
      [hidden] { display: none; }
    </style>
  <link rel="stylesheet" href="/assets/web.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/crosspoint-icon.svg" />
  </head>
  <body class="web-ui">
    <!--#include file="../shared/Header.zh-CN.html.inc" -->
<main class="page-content">

    <p class="warn" id="apWarning" hidden>
      设备热点是开放网络，附近的人可能读取通过它发送的密钥。如有可能，请先让设备和手机连接到你自己的 Wi-Fi。
    </p>

    <div id="status" role="status"></div>

    <form id="form" class="applab-form" autocomplete="off">
      <div class="card">
        <h2>Gemini</h2>
        <label for="geminiKey">API 密钥</label>
        <input id="geminiKey" type="password" autocapitalize="off" spellcheck="false" autocomplete="new-password" />
        <p class="hint" id="keyHint"></p>
        <label for="model">模型</label>
        <input id="model" type="text" autocapitalize="off" spellcheck="false" />
        <p class="hint">留空使用默认模型。可在 aistudio.google.com 获取密钥。</p>
      </div>

      <div class="card">
        <h2>下一个应用</h2>
        <label for="prompt">描述你想要的应用</label>
        <textarea id="prompt" maxlength="2000" placeholder="一个番茄钟：大号数字、开始/暂停按钮，并统计完成的次数"></textarea>
        <p class="hint">在设备上打开 App Lab，选择“生成手机发来的应用”。</p>
      </div>

      <button id="save" class="save-btn" type="submit">保存</button>
      <p class="hint">已保存的密钥不会在此显示。密钥在你的网络上以未加密方式发送，请仅在你信任的网络上使用。</p>
    </form>

    </main>
<!--#include file="../shared/Footer.zh-CN.html.inc" -->
    <script>
      const el = (id) => document.getElementById(id);

      function showStatus(text, ok) {
        const status = el('status');
        status.textContent = text;
        status.className = ok ? 'ok' : 'err';
      }

      function showConfig(config) {
        el('geminiKey').value = '';
        el('model').value = config.model === config.defaultModel ? '' : config.model;
        el('model').placeholder = config.defaultModel;
        el('prompt').value = config.pendingPrompt;
        el('keyHint').textContent = config.hasKey ? '已保存密钥。留空则保持不变。' : '尚未保存密钥。';
        el('apWarning').hidden = !config.apMode;
      }

      async function load() {
        const res = await fetch('/api/applab');
        if (!res.ok) throw new Error(await res.text());
        showConfig(await res.json());
      }

      el('form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const body = { model: el('model').value, prompt: el('prompt').value };
        // 密钥留空表示保留已保存的密钥，因此不包含在请求中。
        if (el('geminiKey').value) body.geminiKey = el('geminiKey').value;

        el('save').disabled = true;
        try {
          const res = await fetch('/api/applab', { method: 'POST', body: JSON.stringify(body) });
          if (!res.ok) throw new Error(await res.text());
          showConfig(await res.json());
          showStatus('已保存。在设备上打开 App Lab。', true);
        } catch (error) {
          showStatus(error.message, false);
        } finally {
          el('save').disabled = false;
        }
      });

      load().catch((error) => showStatus('无法加载设置：' + error.message, false));
    </script>
  </body>
</html>
